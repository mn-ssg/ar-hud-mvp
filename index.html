<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초보 운전자를 위한 AR-HUD</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles/styles.css">
<link rel="stylesheet" href="styles/hud.css">
</head>
<body>
<div class="app" id="app" data-screen="home">

<!-- 위 막대: 처음 · 시연 화면에서만 (주행 중에는 숨김 — 운전 화면을 넓게). 연구자용 버튼만 -->
<header class="topbar" id="topbar">
  <div class="brand"><b>AR-HUD 주행 실험</b><span id="statusLine"></span></div>
  <div class="topbar-actions">
    <button class="btn ghost" id="pauseBtn" hidden>일시정지</button>
    <button class="btn ghost" id="homeBtn" hidden>처음으로</button>
    <button class="btn ghost" id="logBtn">기록 <span id="logCount" class="count">0</span></button>
    <button class="btn ghost" id="setupBtn" aria-expanded="false">연구자 설정</button>
  </div>
</header>

<div class="stage">
<!-- 연구자 설정: 시연 조건 · 보기. 참가자 화면이 아님 — 주행 테스트 중에는 닫히고 잠김. (2026-11-07: 연습 주행 · 룸미러 체크박스 삭제 — 연습은 늘 하고 룸미러는 늘 켬) -->
<aside class="setup" id="setup" hidden>
  <section id="scenario">
    <h2>시연</h2>
    <p class="field">HUD</p>
    <div class="seg" id="modeSeg">
      <button data-mode="nav" aria-pressed="false">현대 HUD</button>
      <button data-mode="ar2" aria-pressed="true">2차 HUD</button>
      <button data-mode="ar" aria-pressed="false">1차 HUD</button>
    </div>
    <p class="field">시간대</p>
    <div class="seg ico-seg" id="lightSeg">
      <button data-light="day" data-ico="sun" aria-pressed="true">주간</button>
      <button data-light="night" data-ico="moon" aria-pressed="false">야간</button>
    </div>
    <p class="field">맵 <span class="field-note" id="mapName"></span></p>
    <div class="seg maps" id="mapSeg">
      <button data-m="ICR" aria-pressed="true" title="IC 오른쪽 진출">①</button>
      <button data-m="JC4" aria-pressed="false" title="JC 4차로">②</button>
      <button data-m="SEQ" aria-pressed="false" title="연속 분기">③</button>
      <button data-m="CL2" aria-pressed="false" title="이중 좌회전">④</button>
      <button data-m="CRT" aria-pressed="false" title="우회전 · 횡단보도">⑤</button>
    </div>
    <div class="seg" id="targetSeg"></div>
    <div class="seg" id="jamSeg">
      <button data-j="0" aria-pressed="true">뒤차</button>
      <button data-j="3" aria-pressed="false">정체</button>
    </div>
    <button class="btn primary block" id="demoSide">시연 시작</button>
  </section>

  <section>
    <h2>보기</h2>
    <button class="btn block" id="explainBtn" aria-pressed="false">HUD 설명 보기 (발표용)</button>
  </section>
</aside>

<!-- 운전석 영역 -->
<main class="cab" id="cab">
  <div id="view"></div>
  <!-- 앞유리 틀 · 대시보드 · 핸들은 3D 실내(cabin.js)로, 룸미러는 mirrors.js로 그린다 (사이드미러 없음) -->

  <div id="hudWrap">
    <!-- HUD 표시 영역 = 이 상자(viewBox 520 × 270) 하나. 두 HUD의 모든 층은 #hudClip 안에서만 그린다 (2026-10-29) -->
    <svg id="hudSvg" viewBox="0 0 520 270" aria-hidden="true">
      <defs>
        <clipPath id="hudClip" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="520" height="270"/></clipPath>
        <linearGradient id="fadeTop" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="102">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
        </linearGradient>
        <mask id="roadMask" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="270">
          <rect x="0" y="80" width="520" height="156" fill="url(#fadeTop)"/>
        </mask>
        <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff4d4d" stop-opacity="0"/><stop offset=".5" stop-color="#ff4d4d" stop-opacity=".95"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
        </linearGradient>
        <!-- 정체 구간 빗금: 대각선 줄무늬가 흐르며 '막힘'을 표현 -->
        <pattern id="jamHatch" patternUnits="userSpaceOnUse" width="14" height="14">
          <rect width="14" height="14" fill="#ffb020" fill-opacity=".14"/>
          <path d="M-2 12 L12 -2 M4 18 L18 4" stroke="#ffb020" stroke-opacity=".65" stroke-width="4"/>
          <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="14 -14" dur="1.1s" repeatCount="indefinite"/>
        </pattern>
        <!-- 들어갈 차로: 가까울수록 밝게 (원근감). v1.4: HUD에서 가장 진하게 -->
        <linearGradient id="laneGrad" gradientUnits="userSpaceOnUse" x1="0" y1="228" x2="0" y2="88">
          <stop id="lgA" offset="0" stop-color="#00e5ff" stop-opacity=".62"/><stop id="lgB" offset=".55" stop-color="#00e5ff" stop-opacity=".3"/><stop id="lgC" offset="1" stop-color="#00e5ff" stop-opacity=".1"/>
        </linearGradient>
        <!-- 옮길 화살표: 꼬리는 흐리고 머리는 선명하게 (좌표는 hud.js가 매 프레임 맞춤) -->
        <linearGradient id="arrowGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
          <stop id="agA" offset="0" stop-color="#3ddc84" stop-opacity=".3"/><stop id="agB" offset="1" stop-color="#3ddc84" stop-opacity="1"/>
        </linearGradient>
        <!-- HUD 빛 번짐: 유리에 맺힌 빛처럼 -->
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="dangerRad"><stop offset="0" stop-color="#ff4d4d" stop-opacity=".75"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/></radialGradient>
        <!-- ===== 우리 HUD 2.1(개선 후) 전용 — 미니 도로가 내 차 뒤(상자 아래끝)까지 이어지므로 마스크를 아래까지. 색 · 흐림은 hud.css 토큰(--h2-*)을 hud2.js가 읽어 넣는다 ===== -->
        <mask id="roadMask2" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="270">
          <rect x="0" y="80" width="520" height="190" fill="url(#fadeTop)"/>
        </mask>
        <linearGradient id="laneGrad2" gradientUnits="userSpaceOnUse" x1="0" y1="228" x2="0" y2="88">
          <stop id="lg2A" offset="0" stop-color="#5fd4ea"/><stop id="lg2B" offset=".55" stop-color="#5fd4ea"/><stop id="lg2C" offset="1" stop-color="#5fd4ea"/>
        </linearGradient>
        <linearGradient id="arrowGrad2" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
          <stop id="ag2A" offset="0" stop-color="#4cd38a" stop-opacity=".3"/><stop id="ag2B" offset="1" stop-color="#4cd38a" stop-opacity="1"/>
        </linearGradient>
        <!-- 가장자리 빛 (2026-11-04): 세로 번짐만 있던 네모 막대 → 가로로도 바깥 가장자리에서 안쪽으로 서서히 사라지게(가로 그라데이션 채움 + 세로 마스크). 색은 hud2.js가 넣음 -->
        <linearGradient id="edgeGrad2R" x1="1" y1="0" x2="0" y2="0"><stop class="eg2" offset="0" stop-color="#ff5a4f" stop-opacity="1"/><stop class="eg2" offset=".45" stop-color="#ff5a4f" stop-opacity=".35"/><stop class="eg2" offset="1" stop-color="#ff5a4f" stop-opacity="0"/></linearGradient>
        <linearGradient id="edgeGrad2L" x1="0" y1="0" x2="1" y2="0"><stop class="eg2" offset="0" stop-color="#ff5a4f" stop-opacity="1"/><stop class="eg2" offset=".45" stop-color="#ff5a4f" stop-opacity=".35"/><stop class="eg2" offset="1" stop-color="#ff5a4f" stop-opacity="0"/></linearGradient>
        <linearGradient id="edgeMaskGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <mask id="edgeMaskV" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#edgeMaskGrad)"/></mask>
        <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="1.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g clip-path="url(#hudClip)">
        <!-- ===== 우리 HUD v1.4 — 정보 위계(01_프로젝트/10_HUD_GUI_설계.md)
             행동 단계 글자('이동'·'유지' 등)는 없다. 상태는 미니 도로의 옮길 화살표와 막대만으로 읽는다
             ① 들어갈 차로 · 경로: 미니 도로(실제 도로를 옮긴 모형) — HUD에서 가장 크고 진하게(채도 높은 청록).
                옮길 화살표(초록 흐름 = 옮겨도 됨 / 주황 = 서두름 · 주황 점 = 틈 대기 / 빨간 점 + 멈춤 막대 = 대기) · 정체 차량과 틈 · 뒤차
             ② 갈 방향: 가운데 위, 다음 갈림에서 갈 쪽 화살표만. 경로색 하나로 고정(상태를 담지 않음)
             ③ 언제: 숫자 없는 막대(초록→주황→빨강 연속) + 미니 도로 마감선. 뒤차로 기다리는 동안엔 회색으로 흐리게
             ④ 제한속도: 왼쪽 위, 표지 모양 그대로 (v1.8: 차속 삭제 · 맨 아래 → 왼쪽 위 · 반지름 8.5 → 21). 도로 윤곽선은 흐리게 → 경로가 먼저 보이도록 ===== -->
        <g id="arHud">
          <g mask="url(#roadMask)">
            <path id="roadSurf" fill="#ffffff" fill-opacity=".045"/>
            <path id="laneFill" fill="url(#laneGrad)"/>
            <path id="roadEdges" fill="#eaf6ff" fill-opacity=".5"/>
            <path id="roadDash" fill="#eaf6ff" fill-opacity=".3"/>
            <path id="jamBand" fill="url(#jamHatch)" opacity="0"/>
            <path id="pulses" fill="#00e5ff"/>
            <path id="laneRails" fill="#00e5ff" filter="url(#glow)"/>
            <g id="veh"></g>
            <path id="gapMark" fill="none" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
            <path id="slot" fill="#00e5ff" fill-opacity=".2" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round"/>
            <path id="gate" filter="url(#glow)"/>
            <!-- 일반도로 (D69): 멈출 곳(빨간불 정지선 · 보행자 앞 횡단보도) 빨간 막대 + 보행자 점 -->
            <path id="cityStop" fill="#ff4d4d" filter="url(#glow)"/>
            <path id="pedDots" fill="#ffffff" fill-opacity=".9"/>
          </g>
          <g id="moveGrp" filter="url(#glow)">
            <path id="moveArrow" fill="none" stroke="url(#arrowGrad)" stroke-width="8" stroke-linecap="round"/>
            <path id="moveHead" stroke="none" stroke-linejoin="round"/>
            <path id="moveStop" fill="none" stroke="#ff4d4d" stroke-width="6" stroke-linecap="round"/>
            <path id="moveStopCore" fill="none" stroke="#ffd2cc" stroke-width="2.4" stroke-linecap="round"/><!-- 멈춤 막대의 밝은 심: 빨강은 휘도가 낮아 낮에 대비가 3:1 언저리라 (v1.5) -->
          </g>
          <!-- 내 차: 뒷모습 -->
          <g id="ego" transform="translate(260 221)" fill="#eaf6ff">
            <path d="M-15 4 Q-15 -3 -11 -4 L-7 -10 Q-6 -12 -3 -12 H3 Q6 -12 7 -10 L11 -4 Q15 -3 15 4 V7 Q15 9 13 9 H-13 Q-15 9 -15 7 Z" fill-opacity=".92"/>
            <rect x="-12" y="0" width="5" height="2.6" rx="1.3" fill="#ff6a6a"/><rect x="7" y="0" width="5" height="2.6" rx="1.3" fill="#ff6a6a"/>
            <path d="M-5 -9 H5 L8 -4 H-8 Z" fill="#0b0d10" fill-opacity=".55"/>
          </g>
          <!-- 뒤에서 오는 차 (초보자는 옆·뒤를 잘 안 보므로 가운데 쪽으로 끌어와 보여줌) -->
          <g id="carBehind" opacity="0">
            <circle r="26" fill="url(#dangerRad)"/>
            <rect x="-8" y="-11" width="16" height="22" rx="4" fill="#ff5f5f" stroke="#ffc4bd" stroke-width="1.6"/><rect x="-5" y="-7" width="10" height="6" rx="2" fill="#000" fill-opacity=".45"/>
          </g>
          <rect id="edgeL" x="0" y="96" width="7" height="140" rx="3.5" fill="url(#edgeGrad)" opacity="0"/>
          <rect id="edgeR" x="513" y="96" width="7" height="140" rx="3.5" fill="url(#edgeGrad)" opacity="0"/>

          <!-- ② 갈 방향: 다음 갈림에서 갈 쪽만. 글자·테두리 없음, 경로색 고정. 위치·등장 애니메이션은 hud.js -->
          <g id="act" filter="url(#glow)">
            <g id="nowIcon" transform="scale(1.55)" fill="none" stroke="#00e5ff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
              <g id="icoRight"><path d="M-6 13 V4 Q-6 -4 5 -9 M-1 -13 L8 -9 L4 -1"/></g>
              <g id="icoLeft"><path d="M6 13 V4 Q6 -4 -5 -9 M1 -13 L-8 -9 L-4 -1"/></g>
              <g id="icoUp"><path d="M0 13 V-12 M-8 -4 L0 -13 L8 -4"/></g>
            </g>
          </g>
          <!-- ③ 언제 -->
          <g id="cd" filter="url(#glow)">
            <rect id="cdBg" x="200" y="62" width="120" height="6" rx="3" fill-opacity=".16"/>
            <rect id="cdBar" x="200" y="62" width="120" height="6" rx="3"/>
          </g>
          <!-- ④ 제한속도 (v1.8): 차속은 HUD에서 빼고 계기판으로. 표지는 실제 표지 모양 그대로, 왼쪽 위(갈 방향과 같은 줄) —
               가운데 세로줄(갈 방향 → 막대 → 미니 도로)은 경로만, 규정은 옆으로. 근거 01_프로젝트/10_HUD_GUI_설계.md 0-4절 -->
          <g id="info" transform="translate(112 34)">
            <circle r="21" fill="#fff" fill-opacity=".92" stroke="#e5262b" stroke-width="5"/>
            <text id="limA" y="6.8" text-anchor="middle" font-size="19" font-weight="700" fill="#111" class="hud-t tnum">80</text>
          </g>
        </g>

        <!-- ===== 우리 HUD 2.1 (개선 후, 2026-11-03 — 10주차 발표 '상태 6개') =====
             자리 · 크기 · 길 안내(① 들어갈 차로 ② 갈 방향 ③ 막대 ④ 제한속도)는 개선 전과 같다. 바뀐 것은 뒤차 표현뿐:
             움직이는 뒤차 + 꺾쇠(bRear, 가장 가까운 한 대) · 거리 구간(bDistBand) · 더 오는 차 흐름(bFlow) · 가장자리 빛(bEdgeL/R) · 깜빡임 · 위험 강화의 경계 빨간 선(bBound) · 해소 신호(bClearFill · 화살표 한 번 커짐).
             상태는 data-level(0 안전 · 1 감지 · 2 주의 · 3 대기 · 4 위험 강화). 색 · 굵기 · 투명도 · 시간은 hud.css 맨 위 토큰, 그리기는 hud2.js drawAr2() -->
        <g id="arHud2" data-level="0" style="display:none">
          <g mask="url(#roadMask2)">
            <path id="bSurf" class="b-surf"/>
            <path id="bLaneFill" fill="url(#laneGrad2)"/>
            <path id="bEdges" class="b-edges"/>
            <path id="bDash" class="b-dash"/>
            <path id="bJam" fill="url(#jamHatch)" opacity="0"/>
            <path id="bPulses" class="b-pulses"/>
            <path id="bRails" class="b-rails" filter="url(#glow2)"/>
            <!-- 06 해소 신호 (2026-11-04): 들어갈 차로 전체가 초록으로 찼다 천천히 빠짐 (길이 config.js REAR2.clearT). 화살표 한 번 커짐은 #bMoveGrp transform -->
            <path id="bClearFill" class="b-clear"/>
            <g id="bVeh"></g>
            <path id="bGapMark" class="b-gapmark" filter="url(#glow2)"/>
            <path id="bSlot" class="b-slot"/>
            <path id="bGate" filter="url(#glow2)"/>
            <path id="bCityStop" class="b-citystop" filter="url(#glow2)"/>
            <path id="bPed" class="b-ped"/>
            <path id="bBound" class="b-bound" filter="url(#glow2)"/>
            <path id="bBoundCore" class="b-boundcore"/>
            <!-- 거리: 내 차 뒤부터 뒤차까지 옮길 차로를 칠한 구간 — 가까울수록 짧고 진하게, 색은 단계(2026-11-03 사용자 선택 7-B, 간격 막대 대신) -->
            <path id="bDistBand" class="b-distband"/>
            <!-- 뒤에 더 오는 차가 있으면 옮길 차로 아래쪽에 위로 흐르는 띠(4-C) — 차 아이콘은 가장 가까운 한 대만 -->
            <path id="bFlow" class="b-flow"/>
            <!-- 기준 차가 바뀔 때 이전 차가 0.3초 동안 사라짐(제자리에서) -->
            <g id="bRearOld" class="b-rear" opacity="0">
              <rect class="b-rear-old-body" x="-15" y="-10" width="30" height="20" rx="4"/>
              <rect class="b-rear-glass" x="-10" y="-6" width="20" height="5" rx="1.5"/>
            </g>
            <!-- 뒤차: 크기 고정(원근 축소 없음 — 가까울수록 작아져 반대로 읽힘). 꺾쇠 수 = 접근 속도 -->
            <g id="bRear" class="b-rear" opacity="0">
              <rect id="bRearBody" x="-15" y="-10" width="30" height="20" rx="4"/>
              <rect class="b-rear-glass" x="-10" y="-6" width="20" height="5" rx="1.5"/>
              <g id="bChev" class="b-chev"><path d="M-7 -15 L0 -21 L7 -15"/><path d="M-7 -22 L0 -28 L7 -22"/><path d="M-7 -29 L0 -35 L7 -29"/></g>
            </g>
          </g>
          <g id="bMoveGrp" filter="url(#glow2)">
            <path id="bMove" class="b-move" fill="none" stroke="url(#arrowGrad2)" stroke-linecap="round"/>
            <path id="bHead" stroke="none" stroke-linejoin="round"/>
          </g>
          <!-- 내 차 (2026-11-03 키움): 1차의 30 × 21px → 1.5배(45 × 32), 흰색 속 참 + 밝은 테. 자리(260, 221)는 그대로 — 미니 도로의 기준점 -->
          <g id="bEgo" class="b-ego" transform="translate(260 221) scale(1.5)">
            <path d="M-15 4 Q-15 -3 -11 -4 L-7 -10 Q-6 -12 -3 -12 H3 Q6 -12 7 -10 L11 -4 Q15 -3 15 4 V7 Q15 9 13 9 H-13 Q-15 9 -15 7 Z" fill-opacity=".92"/>

  <div class="overlay" id="intro">
    <div class="card home">
      <p class="eyebrow">디지털미디어 프로타이핑 · 4팀</p>
      <h1>분기점 차로 안내 주행 실험</h1>
      <p class="lead">HUD를 보고 목적지 출구로 운전합니다.</p>
      <div class="keyrow"><span><kbd>←</kbd><kbd>→</kbd> 핸들</span><span><kbd>↑</kbd> 가속</span><span><kbd>↓</kbd> 브레이크</span></div>
      <button class="btn primary lg block" id="testBtn">주행 테스트 시작</button>
      <div class="row">
        <button class="btn" id="practiceBtn">연습 주행</button>
        <button class="btn" id="demoBtn">시연 보기</button>
      </div>
    </div>
  </div>

  <!-- 진행 카드: 참가자 정보 · 주행 결과 · 질문 · 끝 · 시연 끝 (내용은 session.js sesCard) -->
  <div class="overlay" id="sess" hidden>
    <div class="card">
      <div class="card-head"><span id="sesIcon"></span><div><p class="eyebrow" id="sesEyebrow"></p><h2 id="sesTitle"></h2></div></div>

      <div class="row">
        <button class="btn primary" id="sesBtn"></button>
        <button class="btn" id="sesBtn2" hidden></button>
      </div>
    </div>
  </div>
  <!-- 주행: 3 · 2 · 1 · 키 안내(첫 판 · 연습만) · 연구자용 중단(Esc) -->
  <div id="count" hidden>3</div>
  <div id="keyHint" hidden><span><kbd>←</kbd><kbd>→</kbd> 핸들</span><span><kbd>↑</kbd> 가속</span><span><kbd>↓</kbd> 브레이크</span></div>
  <button class="abort" id="abortBtn" hidden title="연구자: 주행 테스트 중단 (Esc)">중단</button>
</main>
</div>
