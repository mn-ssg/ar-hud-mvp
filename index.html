<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초보 운전자를 위한 AR-HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="app">

<!-- 안내 영역: 발표·조작용. HUD가 아님 -->
<aside class="side">
  <div>
    <h1>초보 운전자를 위한 AR-HUD</h1>
  </div>

  <div class="group">
    <h2>HUD 방식</h2>
    <div class="seg" id="modeSeg">
      <button data-mode="ar" aria-pressed="true">우리 HUD</button>
      <button data-mode="nav" aria-pressed="false">현대 HUD</button>
    </div>
    <p class="mode-desc" id="modeDesc"></p>
    <button class="btn toggle" id="explainBtn" aria-pressed="false">HUD 설명 보기</button>
  </div>

  <div class="group">
    <h2>시간대</h2>
    <div class="seg ico-seg" id="lightSeg">
      <button data-light="day" data-ico="sun" aria-pressed="true">주간</button>
      <button data-light="night" data-ico="moon" aria-pressed="false">야간</button>
    </div>
  </div>

  <div class="group" id="scenario">
    <h2>시연 상황 <span class="hint">· 테스트는 맵을 섞어 한 바퀴씩</span></h2>
    <div class="seg" id="mapSeg">
      <button data-m="Y3" aria-pressed="true"><b>①</b>세 갈래</button>
      <button data-m="ICR" aria-pressed="false"><b>②</b>IC 진출</button>
      <button data-m="ICL" aria-pressed="false"><b>③</b>왼쪽 진출</button>
      <button data-m="JC4" aria-pressed="false"><b>④</b>JC 4차로</button>
      <button data-m="SEQ" aria-pressed="false"><b>⑤</b>연속 분기</button>
    </div>
    <p class="map-name" id="mapName"></p>
    <div class="seg" id="targetSeg"></div>
    <div class="seg" id="jamSeg">
      <button data-j="0" aria-pressed="true">정체 없음</button>
      <button data-j="1" aria-pressed="false">정체</button>
      <button data-j="2" aria-pressed="false">심한 정체</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="demoSide">시연 보기</button>
    <button class="btn" id="testSide">판단 테스트</button>
    <button class="btn" id="pauseBtn">일시정지</button>
    <button class="btn" id="logBtn">기록 <span id="logCount">0</span></button>
  </div>

  <div class="group">
    <h2>진행 단계</h2>
    <ol class="stages" id="stages">
      <li data-s="1"><span class="n">1</span><b>접근</b></li>
      <li data-s="2"><span class="n">2</span><b>지선 구분</b></li>
      <li data-s="3"><span class="n">3</span><b>차로 옮김</b></li>
      <li data-s="4"><span class="n">4</span><b>진입</b></li>
      <li data-s="5"><span class="n">5</span><b>도착</b></li>
    </ol>
  </div>

  <div class="group">
    <h2>우리 HUD 색</h2>
    <div class="legend">
      <div><i class="c1"></i>들어갈 차로 · 갈 방향</div>
      <div><i class="c5"></i>지금 옮겨도 됨</div>
      <div><i class="c3"></i>서두름 · 정체</div>
      <div><i class="c4"></i>대기 (위험)</div>
    </div>
  </div>
</aside>

<!-- 운전석 영역 -->
<main class="cab" id="cab">
  <div id="view"></div>
  <!-- 앞유리 틀 · 대시보드 · 핸들은 3D 실내(cabin.js)로 그린다 -->
  <div class="cab-label">운전석 시점</div>

  <div id="hudWrap">
    <svg viewBox="0 0 520 270" aria-hidden="true">
      <defs>
        <linearGradient id="fadeTop" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="102">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
        </linearGradient>
        <mask id="roadMask" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="270">
          <rect x="0" y="80" width="520" height="156" fill="url(#fadeTop)"/>
        </mask>
        <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff4d4d" stop-opacity="0"/><stop offset=".5" stop-color="#ff4d4d" stop-opacity=".95"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
        </linearGradient>
        <!-- 정체 구간 빗금: 대각선 줄무늬가 흐르며 '막힘'을 표현 -->
        <pattern id="jamHatch" patternUnits="userSpaceOnUse" width="14" height="14">
          <rect width="14" height="14" fill="#ffb020" fill-opacity=".14"/>
          <path d="M-2 12 L12 -2 M4 18 L18 4" stroke="#ffb020" stroke-opacity=".65" stroke-width="4"/>
          <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="14 -14" dur="1.1s" repeatCount="indefinite"/>
        </pattern>
        <!-- 들어갈 차로: 가까울수록 밝게 (원근감). v1.4: HUD에서 가장 진하게 -->
        <linearGradient id="laneGrad" gradientUnits="userSpaceOnUse" x1="0" y1="228" x2="0" y2="88">
          <stop id="lgA" offset="0" stop-color="#00e5ff" stop-opacity=".62"/><stop id="lgB" offset=".55" stop-color="#00e5ff" stop-opacity=".3"/><stop id="lgC" offset="1" stop-color="#00e5ff" stop-opacity=".1"/>
        </linearGradient>
        <!-- 옮길 화살표: 꼬리는 흐리고 머리는 선명하게 (좌표는 hud.js가 매 프레임 맞춤) -->
        <linearGradient id="arrowGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
          <stop id="agA" offset="0" stop-color="#3ddc84" stop-opacity=".3"/><stop id="agB" offset="1" stop-color="#3ddc84" stop-opacity="1"/>
        </linearGradient>
        <!-- HUD 빛 번짐: 유리에 맺힌 빛처럼 -->
        <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <radialGradient id="dangerRad"><stop offset="0" stop-color="#ff4d4d" stop-opacity=".75"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/></radialGradient>
      </defs>

      <!-- ===== 우리 HUD v1.4 — 정보 위계(01_프로젝트/10_HUD_GUI_설계.md)
           행동 단계 글자('이동'·'유지' 등)는 없다. 상태는 미니 도로의 옮길 화살표와 막대만으로 읽는다
           ① 들어갈 차로 · 경로: 미니 도로(실제 도로를 옮긴 모형) — HUD에서 가장 크고 진하게(채도 높은 청록).
              옮길 화살표(초록 흐름 = 옮겨도 됨 / 주황 = 서두름 · 주황 점 = 틈 대기 / 빨간 점 + 멈춤 막대 = 대기) · 정체 차량과 틈 · 뒤차
           ② 갈 방향: 가운데 위, 다음 갈림에서 갈 쪽 화살표만. 경로색 하나로 고정(상태를 담지 않음)
           ③ 언제: 숫자 없는 막대(초록→주황→빨강 연속) + 미니 도로 마감선. 뒤차로 기다리는 동안엔 회색으로 흐리게
           ④ 속도: 맨 아래 작고 흐리게. 도로 윤곽선도 흐리게 → 경로가 먼저 보이도록 ===== -->
      <g id="arHud">
        <g mask="url(#roadMask)">
          <path id="roadSurf" fill="#ffffff" fill-opacity=".045"/>
          <path id="laneFill" fill="url(#laneGrad)"/>
          <path id="roadEdges" fill="#eaf6ff" fill-opacity=".5"/>
          <path id="roadDash" fill="#eaf6ff" fill-opacity=".3"/>
          <path id="jamBand" fill="url(#jamHatch)" opacity="0"/>
          <path id="pulses" fill="#00e5ff"/>
          <path id="laneRails" fill="#00e5ff" filter="url(#glow)"/>
          <g id="veh"></g>
          <path id="gapMark" fill="none" stroke="#3ddc84" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
          <path id="slot" fill="#00e5ff" fill-opacity=".2" stroke="#00e5ff" stroke-width="2" stroke-linejoin="round"/>
          <path id="gate" filter="url(#glow)"/>
        </g>
        <g id="moveGrp" filter="url(#glow)">
          <path id="moveArrow" fill="none" stroke="url(#arrowGrad)" stroke-width="8" stroke-linecap="round"/>
          <path id="moveHead" stroke="none" stroke-linejoin="round"/>
          <path id="moveStop" fill="none" stroke="#ff4d4d" stroke-width="6" stroke-linecap="round"/>
          <path id="moveStopCore" fill="none" stroke="#ffd2cc" stroke-width="2.4" stroke-linecap="round"/><!-- 멈춤 막대의 밝은 심: 빨강은 휘도가 낮아 낮에 대비가 3:1 언저리라 (v1.5) -->
        </g>
        <!-- 내 차: 뒷모습 -->
        <g id="ego" transform="translate(260 221)" fill="#eaf6ff">
          <path d="M-15 4 Q-15 -3 -11 -4 L-7 -10 Q-6 -12 -3 -12 H3 Q6 -12 7 -10 L11 -4 Q15 -3 15 4 V7 Q15 9 13 9 H-13 Q-15 9 -15 7 Z" fill-opacity=".92"/>
          <rect x="-12" y="0" width="5" height="2.6" rx="1.3" fill="#ff6a6a"/><rect x="7" y="0" width="5" height="2.6" rx="1.3" fill="#ff6a6a"/>
          <path d="M-5 -9 H5 L8 -4 H-8 Z" fill="#0b0d10" fill-opacity=".55"/>
        </g>
        <!-- 뒤에서 오는 차 (초보자는 옆·뒤를 잘 안 보므로 가운데 쪽으로 끌어와 보여줌) -->
        <g id="carBehind" opacity="0">
          <circle r="26" fill="url(#dangerRad)"/>
          <rect x="-8" y="-11" width="16" height="22" rx="4" fill="#ff5f5f" stroke="#ffc4bd" stroke-width="1.6"/><rect x="-5" y="-7" width="10" height="6" rx="2" fill="#000" fill-opacity=".45"/>
        </g>
        <rect id="edgeL" x="0" y="96" width="7" height="140" rx="3.5" fill="url(#edgeGrad)" opacity="0"/>
        <rect id="edgeR" x="513" y="96" width="7" height="140" rx="3.5" fill="url(#edgeGrad)" opacity="0"/>

        <!-- ② 갈 방향: 다음 갈림에서 갈 쪽만. 글자·테두리 없음, 경로색 고정. 위치·등장 애니메이션은 hud.js -->
        <g id="act" filter="url(#glow)">
          <g id="nowIcon" transform="scale(1.55)" fill="none" stroke="#00e5ff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
            <g id="icoRight"><path d="M-6 13 V4 Q-6 -4 5 -9 M-1 -13 L8 -9 L4 -1"/></g>
            <g id="icoLeft"><path d="M6 13 V4 Q6 -4 -5 -9 M1 -13 L-8 -9 L-4 -1"/></g>
            <g id="icoUp"><path d="M0 13 V-12 M-8 -4 L0 -13 L8 -4"/></g>
          </g>
        </g>
        <!-- ③ 언제 -->
        <g id="cd" filter="url(#glow)">
          <rect id="cdBg" x="200" y="62" width="120" height="6" rx="3" fill-opacity=".16"/>
          <rect id="cdBar" x="200" y="62" width="120" height="6" rx="3"/>
        </g>
        <!-- ④ 속도 · 제한속도: 보조 정보라 작고 흐리게. 단위 글자(km/h) 없이 숫자만 (v1.5) -->
        <g id="info" opacity=".5">
          <circle cx="249" cy="253" r="8.5" fill="#fff" fill-opacity=".8" stroke="#e04848" stroke-width="2.2"/>
          <text x="249" y="256" text-anchor="middle" font-size="8" font-weight="700" fill="#111" class="hud-t">80</text>
          <text id="spdA" class="hud-t tnum" x="262" y="257.5" font-size="13" font-weight="500" fill="#ffffff">0</text>
        </g>
      </g>

      <!-- ===== 현대 HUD (대조군): 현대 HUD 사진을 그대로 재현. hud.js navMarkup()이 채운다 ===== -->
      <g id="navHud" class="hud-t"></g>
    </svg>
  </div>

  <!-- 발표용: HUD 층마다 이름표 (explain.js). HUD가 아님 -->
  <svg id="explain" aria-hidden="true"></svg>

  <!-- 안내 카드: 아이콘 + 짧은 말 (내용은 main.js setCard) -->
  <div class="overlay" id="intro">
    <div class="card">
      <div class="card-head"><span id="cardIcon"></span><h2 id="cardTitle">① 세 갈래</h2></div>
      <div id="cardText" class="chips"></div>
      <div class="row">
        <button class="btn primary" id="demoBtn"></button>
        <button class="btn" id="testBtn"></button>
      </div>
    </div>
  </div>

  <!-- 질문 카드: 방향은 화살표 그림만(키보드 화살표와 같음), 뒤차 질문은 ‖ 기다림 / ▶ 옮김 (키는 그대로 ↑ / →) -->
  <div class="overlay" id="quiz" hidden>
    <div class="card">
      <h2 id="quizTitle">어느 쪽?</h2>
      <div class="choices icons" id="choicesBranch">
        <button data-c="0" data-ico="L" aria-label="왼쪽"></button>
        <button data-c="1" data-ico="S" aria-label="직진"></button>
        <button data-c="2" data-ico="R" aria-label="오른쪽"></button>
      </div>
      <div class="choices two icons" id="choicesDanger" hidden>
        <button data-a="wait" data-ico="wait">기다림<kbd>↑</kbd></button>
        <button data-a="go" data-ico="play">옮김<kbd>→</kbd></button>
      </div>
    </div>
  </div>
  <div id="toast" hidden></div>
</main>
</div>

<aside id="drawer" aria-label="판단 테스트 기록">
  <header><h2>판단 테스트 기록</h2><button class="btn" id="closeDrawer">닫기</button></header>
  <label>참가자 <input type="text" id="pid" value="P1" autocomplete="off"></label>
  <div id="summary"></div>
  <div class="tablewrap"><table>
    <thead><tr><th>참가자</th><th>HUD</th><th>시간대</th><th>맵</th><th>상황</th><th>정답</th><th>선택</th><th>결과</th><th>시간(초)</th></tr></thead>
    <tbody id="logBody"></tbody>
  </table><div class="empty" id="logEmpty">아직 기록이 없습니다. 판단 테스트를 시작하면 여기에 쌓입니다.</div></div>
  <textarea id="csvBox" hidden readonly></textarea>
  <div class="row">
    <button class="btn" id="copyCsv">CSV 복사</button>
    <button class="btn" id="clearLog">기록 지우기</button>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- 순서 중요: 상수 → 맵 → 3D장면 → 실내 → HUD → 로직 -->
<script src="config.js"></script>
<script src="maps.js"></script>
<script src="scene.js"></script>
<script src="cabin.js"></script>
<script src="hud.js"></script>
<script src="main.js"></script>
<script src="explain.js"></script>
</body>
</html>
