<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초보 운전자를 위한 AR-HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="app">

<!-- 안내 영역: 발표·조작용. HUD가 아님 -->
<aside class="side">
  <div>
    <h1>초보 운전자를 위한 AR-HUD</h1>
  </div>

  <div class="group">
    <h2>HUD 방식</h2>
    <div class="seg" id="modeSeg">
      <button data-mode="ar" aria-pressed="true">우리 HUD</button>
      <button data-mode="ghost" aria-pressed="false">고스트카</button>
      <button data-mode="nav" aria-pressed="false">기존 HUD</button>
    </div>
  </div>

  <div class="group" id="scenario">
    <h2>시연 상황 <span class="hint">· 테스트는 무작위</span></h2>
    <div class="seg" id="targetSeg">
      <button data-t="0" aria-pressed="false">왼쪽</button>
      <button data-t="1" aria-pressed="false">가운데</button>
      <button data-t="2" aria-pressed="true">오른쪽</button>
    </div>
    <div class="seg" id="jamSeg">
      <button data-j="0" aria-pressed="true">정체 없음</button>
      <button data-j="1" aria-pressed="false">정체</button>
      <button data-j="2" aria-pressed="false">심한 정체</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="demoSide">시연 보기</button>
    <button class="btn" id="testSide">판단 테스트</button>
    <button class="btn" id="pauseBtn">일시정지</button>
    <button class="btn" id="logBtn">기록 <span id="logCount">0</span></button>
  </div>

  <div class="group">
    <h2>진행 단계</h2>
    <ol class="stages" id="stages">
      <li data-s="1"><span class="n">1</span><b>접근</b></li>
      <li data-s="2"><span class="n">2</span><b>지선 구분</b></li>
      <li data-s="3"><span class="n">3</span><b>차로 옮김</b></li>
      <li data-s="4"><span class="n">4</span><b>진입</b></li>
      <li data-s="5"><span class="n">5</span><b>도착</b></li>
    </ol>
  </div>

  <div class="group">
    <h2>우리 HUD 색</h2>
    <div class="legend">
      <div><i class="c1"></i>내 차로 (어디로)</div>
      <div><i class="c5"></i>지금 옮겨도 됨</div>
      <div><i class="c3"></i>서두름 · 정체</div>
      <div><i class="c4"></i>대기 (위험)</div>
    </div>
  </div>
</aside>

<!-- 운전석 영역 -->
<main class="cab" id="cab">
  <div id="view"></div>
  <svg id="frame" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="pillarL" x1="0" x2="1"><stop offset="0" stop-color="#0b0c0e"/><stop offset=".85" stop-color="#1d2025"/><stop offset="1" stop-color="#34383e"/></linearGradient>
      <linearGradient id="pillarR" x1="1" x2="0"><stop offset="0" stop-color="#0b0c0e"/><stop offset=".85" stop-color="#1d2025"/><stop offset="1" stop-color="#34383e"/></linearGradient>
    </defs>
    <path d="M0 0 H100 V2.6 Q50 5.4 0 2.6 Z" fill="#141619"/>
    <path d="M0 2.4 L3.4 3.6 L.8 84 L0 84 Z" fill="url(#pillarL)"/>
    <path d="M100 2.4 L96.6 3.6 L99.2 84 L100 84 Z" fill="url(#pillarR)"/>
  </svg>
  <div id="dash"></div>
  <!-- 핸들: 운전석 소품. HUD 색(청록·주황·빨강)은 쓰지 않는다. 림은 원형이라 고정, .turn만 돈다 -->
  <svg id="wheel" viewBox="0 0 400 230" aria-hidden="true">
    <defs>
      <linearGradient id="rimShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4a5058"/><stop offset=".22" stop-color="#23272c"/><stop offset="1" stop-color="#0f1113"/>
      </linearGradient>
    </defs>
    <g class="turn">
      <path d="M152 184 L34 194 L34 224 L152 228 Z M248 184 L366 194 L366 224 L248 228 Z M184 238 L190 372 L210 372 L216 238 Z" fill="#1d2025" stroke="#fff" stroke-opacity=".06"/>
      <g fill="#2a2e34"><circle cx="84" cy="208" r="6"/><circle cx="108" cy="208" r="6"/><circle cx="292" cy="208" r="6"/><circle cx="316" cy="208" r="6"/></g>
      <rect x="148" y="160" width="104" height="92" rx="34" fill="#191b1f" stroke="#fff" stroke-opacity=".07"/>
    </g>
    <circle cx="200" cy="200" r="170" fill="none" stroke="url(#rimShade)" stroke-width="24"/>
    <circle cx="200" cy="200" r="182" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"/>
    <g class="turn"><rect x="195" y="18" width="10" height="24" rx="2" fill="#c9ced4" fill-opacity=".7"/></g>
  </svg>
  <div class="cab-label">운전석 시점</div>

  <div id="hudWrap">
    <svg viewBox="0 0 520 270" aria-hidden="true">
      <defs>
        <linearGradient id="fadeTop" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="126">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
        </linearGradient>
        <mask id="roadMask" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="270">
          <rect x="0" y="104" width="520" height="132" fill="url(#fadeTop)"/>
        </mask>
        <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff4d4d" stop-opacity="0"/><stop offset=".5" stop-color="#ff4d4d" stop-opacity=".95"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
        </linearGradient>
        <!-- 정체 구간 빗금: 대각선 줄무늬가 흐르며 '막힘'을 표현 -->
        <pattern id="jamHatch" patternUnits="userSpaceOnUse" width="14" height="14">
          <rect width="14" height="14" fill="#ffb020" fill-opacity=".14"/>
          <path d="M-2 12 L12 -2 M4 18 L18 4" stroke="#ffb020" stroke-opacity=".65" stroke-width="4"/>
          <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="14 -14" dur="1.1s" repeatCount="indefinite"/>
        </pattern>
      </defs>

      <!-- ===== 우리 HUD v1.2 — 정보 위계(01_프로젝트/10_HUD_GUI_설계.md)
           ① 지금 할 한 가지: 가운데 위, 아이콘 + 한 단어, 신호등 색(초록 옮겨도 됨 · 주황 서두름/정체 · 빨강 대기)
           ② 언제: 그 바로 아래 줄어드는 막대 + 미니 도로의 마감선 (숫자 없음)
           ③ 어디로: 미니 도로 — 내 차로(청록)가 지선까지, 옮길 방향 화살표, 정체 줄과 설 칸, 뒤에서 오는 차
           ④ 속도·제한속도: 맨 아래 작게. 남은 거리·방면·도착시각은 계기판/내비 몫이라 HUD에서 뺌 ===== -->
      <g id="arHud">
        <g mask="url(#roadMask)">
          <path id="laneFill" stroke-linejoin="round"/>
          <path id="rdLines" fill="none" stroke="#e8f0f4" stroke-opacity=".62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="rdDash" fill="none" stroke="#e8f0f4" stroke-opacity=".42" stroke-width="1.7" stroke-dasharray="7 7"/>
          <path id="jamBand" fill="url(#jamHatch)" stroke="#ffb020" stroke-opacity=".6" stroke-width="1" opacity="0"/>
          <path id="slot" fill="#46e6ff" fill-opacity=".22" stroke="#46e6ff" stroke-width="2" stroke-linejoin="round"/>
          <path id="gate" fill="none" stroke-width="4" stroke-linecap="round"/>
          <rect id="carAhead" width="16" height="12" rx="3" fill="#ff4d4d" opacity="0"/>
        </g>
        <path id="moveArrow" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="moveHead" stroke="none"/>
        <path id="moveStop" fill="none" stroke="#ff4d4d" stroke-width="5" stroke-linecap="round"/>
        <path d="M260 212 l10 15 l-10 -4.5 l-10 4.5 z" fill="#ffffff" fill-opacity=".9"/>
        <g id="carBehind" opacity="0"><rect x="-8" y="-11" width="16" height="22" rx="4" fill="#ff4d4d"/><rect x="-5" y="-7" width="10" height="6" rx="2" fill="#000" fill-opacity=".45"/></g>
        <rect id="edgeL" x="0" y="96" width="7" height="140" rx="3.5" fill="url(#edgeGrad)" opacity="0"/>
        <rect id="edgeR" x="513" y="96" width="7" height="140" rx="3.5" fill="url(#edgeGrad)" opacity="0"/>

        <!-- ① 지금 할 한 가지 (아이콘 + 한 단어). 가운데 정렬은 hud.js가 글자 폭을 재서 맞춘다 -->
        <g id="act">
          <circle id="nowHalo" cx="0" cy="0" r="21" fill="none" stroke-width="3" opacity="0"/>
          <g id="nowIcon" transform="scale(1.2)" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
            <g id="icoRight"><path d="M-6 16 V4 Q-6 -5 6 -11 M-2 -15 L8 -11 L4 -1"/></g>
            <g id="icoLeft"><path d="M6 16 V4 Q6 -5 -6 -11 M2 -15 L-8 -11 L-4 -1"/></g>
            <g id="icoUp"><path d="M0 16 V-15 M-9 -6 L0 -16 L9 -6"/></g>
            <g id="icoCheck"><path d="M-13 0 L-4 9 L13 -9"/></g>
            <g id="icoNoGo"><circle r="15"/><path d="M-8 0 H8"/></g>
            <g id="icoPause"><path d="M-5 -10 V10 M5 -10 V10"/></g>
            <g id="icoQueue"><rect x="-6" y="-17" width="12" height="9" rx="3"/><rect x="-6" y="-4" width="12" height="9" rx="3"/><rect x="-6" y="9" width="12" height="9" rx="3"/></g>
          </g>
          <text id="nowText" class="hud-t" x="30" y="11" font-size="31" font-weight="700" letter-spacing="-.5"></text>
        </g>
        <!-- ② 언제: 숫자 없이 줄어드는 막대 -->
        <g id="cd">
          <rect id="cdBg" x="200" y="64" width="120" height="6" rx="3" fill="#ffffff" fill-opacity=".18"/>
          <rect id="cdBar" x="200" y="64" width="120" height="6" rx="3"/>
        </g>
        <!-- ④ 속도 · 제한속도 (작게) -->
        <g id="info" opacity=".8">
          <circle cx="236" cy="252" r="11" fill="#fff" fill-opacity=".92" stroke="#e04848" stroke-width="3"/>
          <text x="236" y="256" text-anchor="middle" font-size="10.5" font-weight="700" fill="#111" class="hud-t">80</text>
          <text class="hud-t" x="254" y="258" fill="#ffffff"><tspan id="spdA" font-size="17" font-weight="600">0</tspan><tspan font-size="10" dx="3" fill-opacity=".8">km/h</tspan></text>
        </g>
      </g>

      <!-- ===== 고스트카: 안내는 도로 위 가상 차(scene.js)가 맡고, HUD에는 속도만 ===== -->
      <g id="minHud" fill="#ffffff">
        <circle cx="236" cy="252" r="12" fill="#fff" fill-opacity=".9" stroke="#e04848" stroke-width="3"/>
        <text x="236" y="256.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111" class="hud-t">80</text>
        <text class="hud-t" x="258" y="258"><tspan id="spdM" font-size="17" font-weight="600">0</tspan><tspan font-size="10" dx="3" fill-opacity=".8">km/h</tspan></text>
      </g>

      <!-- ===== 기존 HUD (대조군): 현대·기아 순정 HUD 구성 재현. hud.js baseMarkup()이 채운다 ===== -->
      <g id="navHud" class="hud-t"></g>
    </svg>
  </div>

  <div class="overlay" id="intro">
    <div class="card">
      <h2 id="cardTitle">세 갈래 분기점 주행</h2>
      <p id="cardText">HUD가 가야 할 지선을 안내합니다.</p>
      <div class="row">
        <button class="btn primary" id="demoBtn">시연 보기</button>
        <button class="btn" id="testBtn">판단 테스트 시작</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="quiz" hidden>
    <div class="card">
      <h2 id="quizTitle">어느 지선으로 가야 하나요?</h2>
      <p id="quizSub">HUD를 보고 최대한 빨리 고르세요.</p>
      <div class="choices" id="choicesBranch">
        <button data-c="0">왼쪽<kbd>←</kbd></button>
        <button data-c="1">가운데<kbd>↑</kbd></button>
        <button data-c="2">오른쪽<kbd>→</kbd></button>
      </div>
      <div class="choices two" id="choicesDanger" hidden>
        <button data-a="wait">기다린다<kbd>↑</kbd></button>
        <button data-a="go">지금 옮긴다<kbd>→</kbd></button>
      </div>
    </div>
  </div>
  <div id="toast" hidden></div>
</main>
</div>

<aside id="drawer" aria-label="판단 테스트 기록">
  <header><h2>판단 테스트 기록</h2><button class="btn" id="closeDrawer">닫기</button></header>
  <label>참가자 <input type="text" id="pid" value="P1" autocomplete="off"></label>
  <div id="summary"></div>
  <div class="tablewrap"><table>
    <thead><tr><th>참가자</th><th>HUD</th><th>상황</th><th>정답</th><th>선택</th><th>결과</th><th>시간(초)</th></tr></thead>
    <tbody id="logBody"></tbody>
  </table><div class="empty" id="logEmpty">아직 기록이 없습니다. 판단 테스트를 시작하면 여기에 쌓입니다.</div></div>
  <textarea id="csvBox" hidden readonly></textarea>
  <div class="row">
    <button class="btn" id="copyCsv">CSV 복사</button>
    <button class="btn" id="clearLog">기록 지우기</button>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- 순서 중요: 상수 → 3D장면 → HUD → 로직 -->
<script src="config.js"></script>
<script src="scene.js"></script>
<script src="hud.js"></script>
<script src="main.js"></script>
</body>
</html>
