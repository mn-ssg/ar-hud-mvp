<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초보 운전자를 위한 AR-HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="hud.css">
</head>
<body>
<div class="app">

<!-- 안내 영역: 발표·조작용. HUD가 아님 -->
<aside class="side">
  <div>
    <h1>초보 운전자를 위한 AR-HUD</h1>
  </div>

  <div class="group">
    <h2>HUD 방식</h2>
    <div class="seg" id="modeSeg">
      <button data-mode="ar" aria-pressed="true">HUD</button>
      <button data-mode="nav" aria-pressed="false">기존 HUD</button>
    </div>
  </div>

  <div class="group" id="scenario">
    <h2>시연 상황 <span class="hint">· 테스트는 무작위</span></h2>
    <div class="seg" id="targetSeg">
      <button data-t="0" aria-pressed="false">왼쪽</button>
      <button data-t="1" aria-pressed="false">가운데</button>
      <button data-t="2" aria-pressed="true">오른쪽</button>
    </div>
    <div class="seg" id="jamSeg">
      <button data-j="0" aria-pressed="true">정체 없음</button>
      <button data-j="1" aria-pressed="false">정체</button>
      <button data-j="2" aria-pressed="false">심한 정체</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn primary" id="demoSide">시연 보기</button>
    <button class="btn" id="testSide">판단 테스트</button>
    <button class="btn" id="pauseBtn">일시정지</button>
    <button class="btn" id="logBtn">기록 <span id="logCount">0</span></button>
  </div>

  <div class="group">
    <h2>진행 단계</h2>
    <ol class="stages" id="stages">
      <li data-s="1"><span class="n">1</span><b>접근</b></li>
      <li data-s="2"><span class="n">2</span><b>지선 구분</b></li>
      <li data-s="3"><span class="n">3</span><b>차로 옮김</b></li>
      <li data-s="4"><span class="n">4</span><b>진입</b></li>
      <li data-s="5"><span class="n">5</span><b>도착</b></li>
    </ol>
  </div>

  <div class="group">
    <h2>HUD 색</h2>
    <div class="legend">
      <div><i class="c1"></i>지금 할 행동</div>
      <div><i class="c2"></i>부수 정보</div>
      <div><i class="c3"></i>정체·위험</div>
    </div>
  </div>
</aside>

<!-- 운전석 영역 -->
<main class="cab" id="cab">
  <div id="view"></div>
  <div id="dash"></div>
  <div class="cab-label">운전석 시점</div>

  <div id="hudWrap">
    <svg viewBox="0 0 520 270" aria-hidden="true">
      <defs>
        <linearGradient id="fadeTop" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="150">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
        </linearGradient>
        <mask id="roadMask" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="270">
          <rect x="0" y="104" width="520" height="130" fill="url(#fadeTop)"/>
        </mask>
        <linearGradient id="bandNow" gradientUnits="userSpaceOnUse" x1="0" y1="228" x2="0" y2="112">
          <stop offset="0" stop-color="#46e6ff" stop-opacity=".95"/><stop offset=".7" stop-color="#46e6ff" stop-opacity=".55"/><stop offset="1" stop-color="#46e6ff" stop-opacity=".15"/>
        </linearGradient>
        <linearGradient id="bandWarn" gradientUnits="userSpaceOnUse" x1="0" y1="228" x2="0" y2="112">
          <stop offset="0" stop-color="#ffb020" stop-opacity=".7"/><stop offset="1" stop-color="#ffb020" stop-opacity=".1"/>
        </linearGradient>
        <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff4d4d" stop-opacity="0"/><stop offset=".5" stop-color="#ff4d4d" stop-opacity=".95"/><stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
        </linearGradient>
        <!-- 정체 구간 빗금: 대각선 줄무늬가 흐르며 '막힘'을 표현 -->
        <pattern id="jamHatch" patternUnits="userSpaceOnUse" width="14" height="14">
          <rect width="14" height="14" fill="#ff4d4d" fill-opacity=".14"/>
          <path d="M-2 12 L12 -2 M4 18 L18 4" stroke="#ff4d4d" stroke-opacity=".6" stroke-width="4"/>
          <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="14 -14" dur="1.1s" repeatCount="indefinite"/>
        </pattern>
      </defs>

      <!-- ===== 우리 HUD ===== -->
      <g id="arHud">
        <!-- 지금 할 행동 (크게) -->
        <g id="nowGrp">
          <circle id="nowHalo" cx="40" cy="38" r="22" fill="none" stroke-width="3" opacity="0"/>
          <g id="nowIcon" transform="translate(40 38) scale(1.25)" fill="none" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
            <g id="icoFork"><path d="M0 18 V2 M0 2 L-13 -16 M0 2 L0 -18 M0 2 L13 -16"/></g>
            <g id="icoRight"><path d="M-6 18 V4 Q-6 -6 6 -12 M-2 -16 L8 -12 L4 -2"/></g>
            <g id="icoLeft"><path d="M6 18 V4 Q6 -6 -6 -12 M2 -16 L-8 -12 L-4 -2"/></g>
            <g id="icoUp"><path d="M0 18 V-16 M-10 -6 L0 -17 L10 -6"/></g>
            <g id="icoCheck"><path d="M-14 0 L-4 10 L14 -10"/></g>
            <g id="icoWarn"><path d="M0 -18 L19 15 H-19 Z M0 -5 V4 M0 10 V10.5"/></g>
          </g>
          <text id="nowText" class="hud-t" x="78" y="46" font-size="30" font-weight="700"></text>
          <text id="nextText" class="hud-t" x="80" y="73" font-size="14" font-weight="500" fill="#ffffff" fill-opacity=".5"></text>
          <g id="cd" transform="translate(372 14)">
            <text id="cdSec" class="hud-t" x="138" y="26" text-anchor="end" font-size="26" font-weight="700" fill="#46e6ff"></text>
            <text id="cdM" class="hud-t" x="138" y="44" text-anchor="end" font-size="13" fill="#ffffff" fill-opacity=".55"></text>
            <rect x="0" y="54" width="138" height="7" rx="3.5" fill="#46e6ff" fill-opacity=".2"/>
            <rect id="cdBar" x="0" y="54" width="138" height="7" rx="3.5" fill="#46e6ff"/>
          </g>
        </g>

        <!-- 미니 도로 -->
        <g mask="url(#roadMask)">
          <path id="laneFill" stroke="none"/>
          <path id="rdLines" fill="none" stroke="#e8f0f4" stroke-opacity=".5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path id="rdDash" fill="none" stroke="#e8f0f4" stroke-opacity=".3" stroke-width="1.3" stroke-dasharray="6 7"/>
          <path id="jamBand" fill="url(#jamHatch)" stroke="#ff4d4d" stroke-opacity=".5" stroke-width="1" opacity="0"/>
          <path id="band" stroke-width="1.2"/>
          <rect id="carAhead" width="16" height="12" rx="3" fill="#ff4d4d" opacity="0"/>
        </g>
        <g id="jamPin" opacity="0">
          <rect x="-32" y="-11" width="64" height="18" rx="5" fill="#ff4d4d"/>
          <path d="M-5 6 L5 6 L0 13 z" fill="#ff4d4d"/>
          <text id="jamPinT" class="hud-t" x="0" y="2" text-anchor="middle" font-size="11" font-weight="700" fill="#fff"></text>
        </g>
        <g id="tags"></g>
        <path d="M260 214 l10 15 l-10 -4.5 l-10 4.5 z" fill="#ffffff" fill-opacity=".85"/>
        <rect id="edgeL" x="0" y="96" width="7" height="140" rx="3.5" fill="url(#edgeGrad)" opacity="0"/>
        <rect id="edgeR" x="513" y="96" width="7" height="140" rx="3.5" fill="url(#edgeGrad)" opacity="0"/>
        <g id="carBehind" opacity="0"><rect width="16" height="22" rx="4" fill="#ff4d4d"/><rect x="3" y="4" width="10" height="6" rx="2" fill="#000" fill-opacity=".45"/></g>

        <!-- 부수 정보 (흐리게) -->
        <g id="info">
          <circle cx="184" cy="252" r="12" fill="#fff" fill-opacity=".9" stroke="#e04848" stroke-width="3"/>
          <text x="184" y="256.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111" class="hud-t">80</text>
          <text class="hud-t" x="206" y="258" fill="#ffffff"><tspan id="spdA" font-size="17" font-weight="600">0</tspan><tspan font-size="10" dx="3" fill-opacity=".8">km/h</tspan></text>
          <text id="remainA" class="hud-t" x="290" y="257" font-size="12" fill="#ffffff"></text>
        </g>

      </g>

      <!-- ===== 기존 HUD (대조군) ===== -->
      <g id="navHud" fill="#f2f7fa">
        <g id="navLanes" transform="translate(262 24)"></g>
        <g id="navTurn" transform="translate(196 54)"><path d="M0 -12 L9 -1 H3.5 V12 H-3.5 V-1 H-9 Z" fill="#46e6ff"/></g>
        <text id="navText" class="hud-t" x="214" y="59" font-size="14" font-weight="500"></text>
        <g stroke="#e8f0f4" stroke-opacity=".7" stroke-width="1.7" stroke-linecap="round">
          <line x1="196" y1="228" x2="240" y2="120"/><line x1="324" y1="228" x2="280" y2="120"/>
        </g>
        <g stroke="#e8f0f4" stroke-opacity=".3" stroke-width="1.2" stroke-dasharray="5 6">
          <line x1="239" y1="228" x2="253" y2="120"/><line x1="281" y1="228" x2="267" y2="120"/>
        </g>
        <path d="M260 206 l9 13 l-9 -4 l-9 4 z" fill-opacity=".85"/>
        <circle cx="166" cy="170" r="12" fill="#fff" fill-opacity=".9" stroke="#e04848" stroke-width="3"/>
        <text x="166" y="174.5" text-anchor="middle" font-size="11" font-weight="700" fill="#111" class="hud-t">80</text>
        <text class="hud-t" x="260" y="252" text-anchor="middle"><tspan id="spdN" font-size="24" font-weight="500">0</tspan><tspan font-size="11" dx="3" fill-opacity=".8">km/h</tspan></text>
        <text id="navInfo" class="hud-t" x="260" y="268" text-anchor="middle" font-size="11" fill-opacity=".85"></text>
        <text class="hud-t" x="340" y="176" font-size="10.5" font-weight="600" fill="#cfd8e0" fill-opacity=".8">HDA</text>
        <g id="navBsd" transform="translate(356 196)" opacity="0"><rect width="12" height="17" rx="3" fill="#ffb020"/></g>
      </g>
    </svg>
  </div>

  <div class="overlay" id="intro">
    <div class="card">
      <h2 id="cardTitle">세 갈래 분기점 주행</h2>
      <p id="cardText">HUD가 가야 할 지선을 안내합니다.</p>
      <div class="row">
        <button class="btn primary" id="demoBtn">시연 보기</button>
        <button class="btn" id="testBtn">판단 테스트 시작</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="quiz" hidden>
    <div class="card">
      <h2 id="quizTitle">어느 지선으로 가야 하나요?</h2>
      <p id="quizSub">HUD를 보고 최대한 빨리 고르세요.</p>
      <div class="choices" id="choicesBranch">
        <button data-c="0">왼쪽<kbd>←</kbd></button>
        <button data-c="1">가운데<kbd>↑</kbd></button>
        <button data-c="2">오른쪽<kbd>→</kbd></button>
      </div>
      <div class="choices two" id="choicesDanger" hidden>
        <button data-a="wait">기다린다<kbd>↑</kbd></button>
        <button data-a="go">지금 옮긴다<kbd>→</kbd></button>
      </div>
    </div>
  </div>
  <div id="toast" hidden></div>
</main>
</div>

<aside id="drawer" aria-label="판단 테스트 기록">
  <header><h2>판단 테스트 기록</h2><button class="btn" id="closeDrawer">닫기</button></header>
  <label>참가자 <input type="text" id="pid" value="P1" autocomplete="off"></label>
  <div id="summary"></div>
  <div class="tablewrap"><table>
    <thead><tr><th>참가자</th><th>HUD</th><th>상황</th><th>정답</th><th>선택</th><th>결과</th><th>시간(초)</th></tr></thead>
    <tbody id="logBody"></tbody>
  </table><div class="empty" id="logEmpty">아직 기록이 없습니다. 판단 테스트를 시작하면 여기에 쌓입니다.</div></div>
  <textarea id="csvBox" hidden readonly></textarea>
  <div class="row">
    <button class="btn" id="copyCsv">CSV 복사</button>
    <button class="btn" id="clearLog">기록 지우기</button>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- 순서 중요: 상수 → 3D장면 → HUD → 로직 -->
<script src="config.js"></script>
<script src="scene.js"></script>
<script src="hud.js"></script>
<script src="main.js"></script>
</body>
</html>
